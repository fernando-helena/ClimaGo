<ion-header>
  <ion-toolbar color="primary"><ion-title>ClimaGo</ion-title></ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-intro">
    <ion-icon name="partly-sunny-outline"></ion-icon>
    <h1>Bienvenido</h1>
    <p>Inicia sesión para consultar el clima y guardar tus ciudades.</p>
  </div>

  <form (ngSubmit)="submit()">
    <ion-list lines="full">
      <ion-item><ion-input label="Correo electrónico" labelPlacement="stacked" type="email" [(ngModel)]="email" name="email" autocomplete="email" required></ion-input></ion-item>
      <ion-item><ion-input label="Contraseña" labelPlacement="stacked" type="password" [(ngModel)]="password" name="password" autocomplete="current-password" required></ion-input></ion-item>
    </ion-list>
    <ion-text color="danger" *ngIf="error"><p>{{ error }}</p></ion-text>
    <ion-button expand="block" type="submit" [disabled]="loading">{{ loading ? 'Ingresando...' : 'Iniciar sesión' }}</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/registro">Crear una cuenta</ion-button>
  </form>
</ion-content>
