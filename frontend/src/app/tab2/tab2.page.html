<div class="app-layout">

  <!-- Menú lateral -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-icon">
        <ion-icon name="partly-sunny-outline"></ion-icon>
      </div>

      <span>Clima<span class="brand-highlight">Go</span></span>
    </div>

    <div class="sidebar-section">

      <span class="sidebar-label">MENÚ PRINCIPAL</span>

      <a routerLink="/tabs/clima"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="sidebar-link">

        <ion-icon name="partly-sunny-outline"></ion-icon>
        <span>Clima</span>
      </a>

      <a routerLink="/tabs/favoritos"
         routerLinkActive="active"
         class="sidebar-link">

        <ion-icon name="heart-outline"></ion-icon>
        <span>Favoritos</span>
      </a>

      <a routerLink="/tabs/historial"
         routerLinkActive="active"
         class="sidebar-link">

        <ion-icon name="time-outline"></ion-icon>
        <span>Historial</span>
      </a>

      <a routerLink="/tabs/config"
         routerLinkActive="active"
         class="sidebar-link">

        <ion-icon name="person-outline"></ion-icon>
        <span>Mi cuenta</span>
      </a>

    </div>

    <div class="sidebar-footer">
      <ion-icon name="cloud-outline"></ion-icon>

      <div>
        <strong>ClimaGo</strong>
        <span>Tu clima, siempre contigo</span>
      </div>
    </div>

  </aside>

  <!-- Contenido de las páginas -->
  <main class="main-content">
    <ion-router-outlet></ion-router-outlet>
  </main>

</div>
